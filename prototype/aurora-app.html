<title>SajuTrip — Aurora Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<style>
  :root{
    --text:#1E293B; --muted:#64748B; --muted2:#94A3B8;
    --glass:rgba(255,255,255,.6); --glass-2:rgba(255,255,255,.45); --brd:rgba(255,255,255,.6);
    --lav:#E0E7FF; --lav2:#E9D5FF; --pink:#FEE2E2; --mint:#D9F99D; --gold:#FEF3C7; --slate:#CBD5E1;
    --e-wood:#BBF7D0;  --e-wood-t:#15803D;
    --e-fire:#FECDD3;  --e-fire-t:#BE123C;
    --e-earth:#FDE68A; --e-earth-t:#A16207;
    --e-metal:#E2E8F0; --e-metal-t:#475569;
    --e-water:#C7D2FE; --e-water-t:#4338CA;
    --grad:linear-gradient(135deg,#CBD5E1 0%,#FEE2E2 40%,#E0E7FF 100%);
    --iris:linear-gradient(120deg,#E9D5FF,#FEE2E2,#C7D2FE,#D9F99D);
    --sans:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,monospace;
    --r:26px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#EAECF1; font-family:var(--sans); color:var(--text); -webkit-font-smoothing:antialiased; min-height:100dvh}

  /* full-bleed app — fills the whole viewport immediately */
  .screen{position:fixed; inset:0; width:100%; height:100dvh; margin:0; background:#fff;
    overflow:hidden; display:flex; flex-direction:column; font-size:14px; line-height:1.5}
  /* keep the app content in a comfortable column even on wide screens */
  .view > .anim{max-width:460px; margin:0 auto}
  .bnav{max-width:460px; margin:0 auto; width:100%}
  .restart-fab{position:absolute; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:20;
    width:38px; height:38px; border-radius:50%; border:1px solid var(--brd); background:rgba(255,255,255,.55);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); color:var(--muted); font-size:17px; cursor:pointer;
    display:grid; place-items:center; -webkit-tap-highlight-color:transparent}
  .restart-fab:hover{background:rgba(255,255,255,.85); color:var(--text)}
  .restart-fab:active{transform:scale(.94)}

  /* aurora blobs */
  .aurora{position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none}
  .blob{position:absolute; border-radius:50%; filter:blur(56px); opacity:.85; mix-blend-mode:normal}
  .b1{width:300px;height:300px; top:-70px; left:-60px; background:radial-gradient(circle at 30% 30%,#E9D5FF,rgba(233,213,255,0)); animation:drift1 18s ease-in-out infinite}
  .b2{width:280px;height:280px; top:-30px; right:-80px; background:radial-gradient(circle at 60% 40%,#FEE2E2,rgba(254,226,226,0)); animation:drift2 22s ease-in-out infinite}
  .b3{width:320px;height:320px; bottom:60px; left:-90px; background:radial-gradient(circle at 50% 50%,#D9F99D,rgba(217,249,157,0)); opacity:.6; animation:drift3 26s ease-in-out infinite}
  .b4{width:300px;height:300px; bottom:-70px; right:-70px; background:radial-gradient(circle at 40% 40%,#C7D2FE,rgba(199,210,254,0)); animation:drift1 24s ease-in-out infinite reverse}
  .b5{width:200px;height:200px; top:40%; left:30%; background:radial-gradient(circle,#FEF3C7,rgba(254,243,199,0)); opacity:.5; animation:drift2 20s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,26px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-26px,30px)}}
  @keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,-22px)}}

  .view{position:relative; z-index:1; flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch}
  .view::-webkit-scrollbar{width:0}
  .pad{padding:20px 22px 26px}
  .anim{animation:fade .4s ease}
  @keyframes fade{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

  /* type */
  h1.big{font-size:30px; font-weight:600; letter-spacing:-.5px; line-height:1.14; margin:0 0 10px; text-wrap:balance}
  h2.hd{font-size:23px; font-weight:600; letter-spacing:-.3px; margin:0 0 6px}
  .eyebrow{font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:var(--muted2); font-weight:600}
  p.sub{color:var(--muted); margin:0 0 18px}
  .fine{font-size:12px; color:var(--muted2)}

  /* glass */
  .glass{background:var(--glass); backdrop-filter:blur(16px) saturate(140%); -webkit-backdrop-filter:blur(16px) saturate(140%);
    border:1px solid var(--brd); border-radius:var(--r); box-shadow:0 10px 30px -18px rgba(30,41,59,.4)}
  .soft-shadow{box-shadow:0 20px 44px -22px rgba(30,41,59,.5)}

  /* buttons */
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; cursor:pointer; border:0;
    font-family:var(--sans); font-size:15.5px; font-weight:600; color:var(--text); border-radius:999px; padding:16px 20px;
    background:var(--iris); background-size:200% 200%; transition:.2s; box-shadow:0 12px 30px -12px rgba(139,92,246,.5); animation:shimmer 8s ease infinite}
  @keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .btn:hover{transform:translateY(-1px); filter:brightness(1.03)}
  .btn:active{transform:translateY(0)}
  .btn:focus-visible{outline:2px solid #8b5cf6; outline-offset:3px}
  .btn.plain{background:var(--glass); backdrop-filter:blur(12px); border:1px solid var(--brd); box-shadow:none; color:var(--text); animation:none}
  .btn.plain:hover{background:rgba(255,255,255,.8)}
  .btn.dark{background:#1E293B; color:#fff; animation:none; box-shadow:0 12px 28px -14px rgba(30,41,59,.7)}
  .btn.dark:hover{background:#0f172a}

  /* pills / chips */
  .chips{display:flex; gap:8px; overflow-x:auto; padding:2px 0}
  .chips::-webkit-scrollbar{height:0}
  .chip{flex:0 0 auto; font-size:12.5px; font-weight:500; padding:9px 15px; border-radius:999px; cursor:pointer; white-space:nowrap;
    background:rgba(255,255,255,.55); backdrop-filter:blur(8px); border:1px solid var(--brd); color:var(--muted); transition:.16s}
  .chip[aria-pressed="true"]{background:#1E293B; color:#fff; border-color:#1E293B}
  .chip:hover{color:var(--text)}

  /* SRP filters (P1) */
  .filters{display:flex; gap:7px; flex-wrap:wrap; margin:12px 0}
  .filt{font-size:11.5px; padding:7px 12px; border-radius:999px; background:rgba(255,255,255,.55); backdrop-filter:blur(8px);
    border:1px solid var(--brd); color:var(--muted); cursor:pointer; transition:.16s}
  .filt.act{border-color:#818cf8; color:var(--e-water-t); background:rgba(199,210,254,.38); font-weight:600}

  /* signup agree + checkin */
  .agree{display:flex; gap:9px; align-items:flex-start; font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.5}
  .agree a{color:var(--e-water-t); text-decoration:underline; cursor:pointer}
  .agree input{margin-top:2px}
  .chkitem{display:flex; gap:10px; align-items:center; padding:9px 0; font-size:13px; color:var(--text)}
  .chkitem + .chkitem{border-top:1px solid rgba(148,163,184,.2)}
  .chkitem input{width:18px; height:18px; accent-color:#6366f1}

  /* icon */
  .ic{width:20px; height:20px; stroke:currentColor; stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto}
  .ic.sm{width:17px;height:17px}

  /* form (F-1 input) */
  .field{margin:15px 0}
  .field > label{display:block; font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .seg{display:flex; gap:8px}
  .seg button{flex:1; padding:15px; border-radius:16px; border:1px solid var(--brd); background:rgba(255,255,255,.5);
    backdrop-filter:blur(8px); font-family:var(--sans); font-size:14px; color:var(--text); cursor:pointer; transition:.16s}
  .seg button[aria-pressed="true"]{background:#1E293B; color:#fff; border-color:#1E293B}
  .dob{display:flex; gap:8px}
  .dob input{width:100%; padding:15px; border-radius:16px; border:1px solid var(--brd); background:rgba(255,255,255,.5);
    font-family:var(--mono); font-size:15px; text-align:center; color:var(--text); outline:none}
  .dob input:focus{border-color:#818cf8; outline:2px solid rgba(129,140,248,.35)}

  /* analyzing */
  .analyze{min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px}
  .analyze .steps{margin-top:22px; display:flex; flex-direction:column; gap:9px; font-size:13px; color:var(--muted)}
  .analyze .steps b{color:var(--text); font-weight:600}

  /* journey (F-5 plan) */
  .prefill{display:flex; align-items:center; gap:10px; padding:13px 15px; margin:8px 0}
  .prefill .lock{font-size:12px; color:var(--e-water-t); margin-left:auto; font-weight:600}
  .daterow{display:flex; gap:8px; margin:14px 0 18px}
  .daterow .d{flex:1; padding:12px 14px}
  .daterow .d .k{font-size:10.5px; text-transform:uppercase; color:var(--muted2); letter-spacing:.5px}
  .daterow .d .v{font-family:var(--mono); font-size:14px; margin-top:3px}
  .day{margin:0 0 16px; padding:14px}
  .day .dh{display:flex; align-items:center; gap:9px; margin-bottom:6px}
  .day .dh .num{width:24px; height:24px; border-radius:8px; background:#1E293B; color:#fff; display:grid; place-items:center; font-family:var(--mono); font-size:12px; font-weight:600}
  .day .dh .lbl{font-size:15px; font-weight:600}
  .day .dh .rgn{margin-left:auto; font-size:10.5px; color:var(--e-wood-t); background:var(--e-wood); border-radius:7px; padding:2px 8px}
  .stop{display:flex; gap:11px; padding:10px 0; border-top:1px dashed rgba(148,163,184,.3)}
  .stop.new{background:rgba(199,210,254,.28); margin:0 -6px; padding:10px 6px; border-radius:12px; border-top-color:transparent}
  .stop .tm{font-family:var(--mono); font-size:11px; color:var(--muted2); width:44px; flex:0 0 auto; padding-top:2px}
  .stop .sx b{font-size:13.5px} .stop .sx span{display:block; font-size:12px; color:var(--muted)}
  .stop .eb{font-family:var(--mono); font-size:12px; color:#fff; border-radius:7px; padding:3px 8px; align-self:center}

  /* share card */
  .sharecard{border-radius:var(--r); padding:22px; color:#fff; margin:6px 0 16px;
    background:radial-gradient(140px 90px at 78% 12%, rgba(199,210,254,.7), transparent), linear-gradient(160deg,#312e81,#4338ca)}
  .sharecard .t2{display:flex; justify-content:space-between; align-items:baseline}
  .sharecard .t2 .bd{font-weight:600}
  .sharecard .t2 .dt{font-family:var(--mono); font-size:11px; color:#c7d2fe}
  .sharecard h3{font-size:22px; font-weight:600; margin:14px 0 4px}
  .sharecard .elrow{margin:14px 0 6px}
  .sharecard .el{background:rgba(255,255,255,.14); color:rgba(255,255,255,.6); border-color:rgba(255,255,255,.2)}
  .sharecard .el.water.on{background:#818cf8; color:#fff; border:0}
  .sharecard .fn{font-family:var(--mono); font-size:12px; color:#c7d2fe}
  .sharecard .rt{font-size:12px; color:#dbe2fb; margin-top:12px; line-height:1.7}

  /* profile rows */
  .prow{display:flex; justify-content:space-between; padding:14px 4px; border-bottom:1px solid rgba(148,163,184,.22); font-size:14px}
  .prow .k{color:var(--muted)} .prow .v{font-family:var(--mono)}

  /* cosmic sphere */
  .orbwrap{display:grid; place-items:center; padding:26px 0 6px; position:relative}
  .orb{width:230px; height:230px; border-radius:50%; position:relative;
    background:conic-gradient(from 90deg,#E9D5FF,#FEE2E2,#FEF3C7,#D9F99D,#C7D2FE,#E9D5FF);
    filter:blur(2px) saturate(150%); animation:spin 20s linear infinite, bob 6s ease-in-out infinite;
    box-shadow:0 30px 70px -20px rgba(139,92,246,.55), inset 0 0 60px rgba(255,255,255,.55)}
  .orb::after{content:""; position:absolute; inset:26px; border-radius:50%; background:radial-gradient(circle at 38% 34%, rgba(255,255,255,.85), rgba(255,255,255,0) 60%)}
  .orb::before{content:""; position:absolute; inset:-30px; border-radius:50%; background:radial-gradient(circle,rgba(233,213,255,.4),rgba(233,213,255,0) 70%); filter:blur(14px)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -12px}}
  .orb-cn{position:absolute; z-index:2; font-family:var(--mono); font-size:34px; color:#fff; text-shadow:0 2px 12px rgba(67,56,202,.5); animation:bob 6s ease-in-out infinite}

  /* five elements */
  .elrow{display:flex; gap:10px; margin:18px 0}
  .el{flex:1; aspect-ratio:1; border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-family:var(--mono); font-size:12px; color:var(--muted); background:rgba(255,255,255,.5); border:1px solid var(--brd)}
  .el .cn{font-size:19px}
  .el.on{color:#fff; border:0}
  .el.on .cn{color:#fff}
  .el.wood.on{background:#4ade80} .el.fire.on{background:#fb7185} .el.earth.on{background:#fbbf24}
  .el.metal.on{background:#94a3b8} .el.water.on{background:#818cf8}
  .el.miss{outline:2px dashed #818cf8; outline-offset:2px; color:var(--e-water-t)}

  .barlist{display:flex; flex-direction:column; gap:11px; margin:6px 0}
  .barrow{display:grid; grid-template-columns:58px 1fr 22px; align-items:center; gap:10px; font-size:13px}
  .barrow .lb{display:flex; gap:6px; align-items:center} .barrow .lb .cn{font-family:var(--mono)}
  .barrow .tk{height:10px; border-radius:999px; background:rgba(148,163,184,.22); overflow:hidden}
  .barrow .tk > span{display:block; height:100%; border-radius:999px}
  .barrow .vv{font-family:var(--mono); font-size:12px; color:var(--muted); text-align:right}

  .tagline{display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 14px}
  .tag{font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px}
  .tag.miss{background:var(--e-water); color:var(--e-water-t)}
  .tag.exc{background:var(--e-fire); color:var(--e-fire-t)}

  /* home */
  .greet{display:flex; align-items:center; gap:12px; margin-bottom:16px}
  .greet .hi{flex:1}
  .greet .hi .s{font-size:12px; color:var(--muted2)}
  .greet .hi .n{font-size:19px; font-weight:600; letter-spacing:-.3px}
  .avatar{width:44px; height:44px; border-radius:50%; background:var(--iris); background-size:180%; box-shadow:0 6px 16px -6px rgba(139,92,246,.5)}
  .searchbar{display:flex; align-items:center; gap:10px; padding:13px 16px; border-radius:999px; color:var(--muted2); margin-bottom:14px}
  .searchbar input{border:0; background:transparent; flex:1; font-family:var(--sans); font-size:14px; color:var(--text); outline:none}
  .searchbar input::placeholder{color:var(--muted2)}

  .feature{position:relative; border-radius:var(--r); overflow:hidden; margin:4px 0 18px; height:210px; cursor:pointer; color:#fff}
  .feature .imgx{position:absolute; inset:0}
  .feature .ov{position:absolute; inset:0; background:linear-gradient(180deg,rgba(15,23,42,0) 30%,rgba(15,23,42,.62) 100%)}
  .feature .bk{position:absolute; top:14px; right:14px; width:38px; height:38px; border-radius:50%; display:grid; place-items:center;
    background:rgba(255,255,255,.25); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.4); color:#fff; cursor:pointer}
  .feature .el-badge{position:absolute; top:16px; left:16px; font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px;
    background:rgba(255,255,255,.25); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.35)}
  .feature .cap{position:absolute; left:18px; bottom:16px; right:18px}
  .feature .cap .rg{font-size:11.5px; opacity:.9; font-family:var(--mono); letter-spacing:.5px}
  .feature .cap .ti{font-size:22px; font-weight:600; letter-spacing:-.3px; margin-top:2px}

  .sec-h{display:flex; align-items:baseline; justify-content:space-between; margin:6px 2px 12px}
  .sec-h .t{font-size:16px; font-weight:600}
  .sec-h .m{font-size:12px; color:var(--muted2)}
  .picks{display:flex; flex-direction:column; gap:10px; padding:14px}
  .pick{display:flex; align-items:center; gap:13px; cursor:pointer; padding:6px; border-radius:16px; transition:.16s}
  .pick:hover{background:rgba(255,255,255,.55)}
  .pick .thumb{width:56px; height:56px; border-radius:15px; flex:0 0 auto}
  .pick .tx{flex:1}
  .pick .tx b{font-size:14.5px; font-weight:600} .pick .tx span{display:block; font-size:12px; color:var(--muted)}
  .pick .el-dot{font-family:var(--mono); font-size:12px; padding:4px 9px; border-radius:999px}

  /* detail */
  .dhero{height:230px; position:relative; color:#fff}
  .dhero .top{position:absolute; top:14px; left:14px; right:14px; display:flex; justify-content:space-between}
  .roundbtn{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; cursor:pointer; color:#fff;
    background:rgba(255,255,255,.25); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.4)}
  .dhero .cap{position:absolute; left:20px; bottom:16px; right:20px}
  .dhero .cap .rg{font-family:var(--mono); font-size:11.5px; opacity:.92}
  .dhero .cap .ti{font-size:25px; font-weight:600; letter-spacing:-.4px}
  .why{padding:16px; margin:16px 0}
  .why .q{font-size:14.5px; line-height:1.55; color:var(--text); margin:0}
  .metr{display:flex; gap:10px; margin:14px 0}
  .metr .m{flex:1; padding:13px; text-align:center}
  .metr .m .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted2)}
  .metr .m .v{font-size:15px; font-weight:600; margin-top:4px}
  .quiet{display:flex; align-items:flex-end; gap:5px; height:52px; margin:12px 0 4px}
  .quiet .q{flex:1; background:rgba(129,140,248,.28); border-radius:5px 5px 0 0}
  .quiet .q.hi{background:rgba(251,113,133,.5)} .quiet .q.lo{background:rgba(74,222,128,.55)}
  .qlab{display:flex; justify-content:space-between; font-family:var(--mono); font-size:9px; color:var(--muted2)}
  .book{display:flex; align-items:center; gap:10px; padding:14px 16px; margin:16px 0}
  .book .yg{font-weight:800; color:#ff2f6d; font-size:14px}
  .book .pr{margin-left:auto; font-family:var(--mono); font-size:13px}

  /* scan */
  .scanwrap{position:relative; height:340px; margin:8px 0 16px; display:grid; place-items:center}
  .viewfinder{position:absolute; inset:20px; }
  .corner{position:absolute; width:34px; height:34px; border:2.5px solid rgba(30,41,59,.55)}
  .corner.tl{top:0;left:0; border-right:0; border-bottom:0; border-radius:14px 0 0 0}
  .corner.tr{top:0;right:0; border-left:0; border-bottom:0; border-radius:0 14px 0 0}
  .corner.bl{bottom:0;left:0; border-right:0; border-top:0; border-radius:0 0 0 14px}
  .corner.br{bottom:0;right:0; border-left:0; border-top:0; border-radius:0 0 14px 0}
  .scancard{width:180px; height:250px; border-radius:22px; background:conic-gradient(from 210deg,#E9D5FF,#FEE2E2,#FEF3C7,#C7D2FE,#E9D5FF);
    box-shadow:0 24px 50px -18px rgba(139,92,246,.5); animation:bob 5s ease-in-out infinite; position:relative; overflow:hidden}
  .scancard .cn{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--mono); font-size:56px; color:rgba(255,255,255,.9); text-shadow:0 3px 16px rgba(67,56,202,.4)}
  .scanline{position:absolute; left:14px; right:14px; height:3px; border-radius:3px; background:linear-gradient(90deg,transparent,rgba(129,140,248,.9),transparent); top:24px; animation:scan 2.6s ease-in-out infinite}
  @keyframes scan{0%,100%{top:24px}50%{top:220px}}
  .status{display:flex; align-items:center; gap:8px; justify-content:center; font-size:14px; font-weight:600; color:var(--text); margin-bottom:8px}
  .instr{padding:16px 18px; margin-top:2px}
  .instr li{list-style:none; display:flex; gap:10px; padding:8px 0; font-size:13px; color:var(--muted)}
  .instr li .d{width:6px;height:6px;border-radius:50%; background:#818cf8; margin-top:7px; flex:0 0 auto}
  .instr ul{margin:0; padding:0}

  /* chat */
  .chatscroll{display:flex; flex-direction:column; gap:12px; padding:18px 18px 12px}
  .actionbar{display:flex; gap:8px; padding:2px 18px 10px; overflow-x:auto}
  .actionbar::-webkit-scrollbar{height:0}
  .act{flex:0 0 auto; display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500; color:var(--text);
    padding:9px 13px; border-radius:999px; background:rgba(255,255,255,.6); backdrop-filter:blur(8px); border:1px solid var(--brd); cursor:pointer}
  .act:hover{background:rgba(255,255,255,.85)}
  .msg{max-width:82%; padding:13px 15px; border-radius:20px; font-size:14px; line-height:1.5; animation:fade .4s ease}

// 하단 고정 메뉴 (스펙): 홈(사주) · 내 일정 · 검색 · 마이페이지
const NAV=[
  {id:"home",    ic:"home",  label:"Home"},
  {id:"journey", ic:"route", label:"Trips"},
  {id:"search",  ic:"search",label:"Search"},
  {id:"my",      ic:"user",  label:"My"},
];
const NAV_TARGET={home:"home", journey:"journey", search:"search", my:"my"};
const SCREEN_NAV={reading:"home", home:"home", detail:"home", journey:"journey", share:"journey", search:"search", my:"my", chat:"home"};

// ---------- render ----------
const view=document.getElementById('view'), bnav=document.getElementById('bnav'), toastEl=document.getElementById('toast');
let analyzeT;
function render(){
  const s=S[state.screen]();
  view.innerHTML=`<div class="anim">${s.html}</div>`;
  view.scrollTop=0;
  clearTimeout(analyzeT);
  if(state.screen==='analyzing'){ analyzeT=setTimeout(()=>{ if(state.screen==='analyzing') go('reading'); }, 1800); }
  if(s.nav){
    bnav.style.display='flex';
    const act=SCREEN_NAV[state.screen];
    bnav.innerHTML=NAV.map(n=>`<button data-navto="${n.id}" aria-current="${act===n.id}">
      <span class="navic">${svg(n.ic,'ic sm')}</span>${n.label}</button>`).join('');
  } else { bnav.style.display='none'; bnav.innerHTML=''; }
}
function go(id){ if(S[id]){ state.screen=id; render(); } }
let tT; function toast(m){ toastEl.textContent=m; toastEl.classList.add('show'); clearTimeout(tT); tT=setTimeout(()=>toastEl.classList.remove('show'),1600); }

document.querySelector('.screen').addEventListener('click', e=>{
  const nav=e.target.closest('[data-nav]'); if(nav){ go(nav.dataset.nav); return; }
  const navto=e.target.closest('[data-navto]'); if(navto){ go(NAV_TARGET[navto.dataset.navto]); return; }
  const pl=e.target.closest('[data-place]'); if(pl){ state.place=pl.dataset.place; go('detail'); return; }
  const add=e.target.closest('[data-add]'); if(add){ toast('Added to your journey'); setTimeout(()=>go('journey'),650); return; }
  const sv=e.target.closest('[data-save]'); if(sv){ state.saved[sv.dataset.save]=true; toast('Saved to 찜'); if(state.screen==='my') render(); return; }
  const su=e.target.closest('[data-signup]'); if(su){ state.signedUp=true; toast('Account created'); setTimeout(()=>go('my'),650); return; }
  const av=e.target.closest('.avatar'); if(av){ go('my'); return; }
  const seg=e.target.closest('[data-seg] button'); if(seg){
    const grp=seg.closest('[data-seg]').dataset.seg, val=seg.dataset.val;
    if(grp==='gender') state.gender=val;
    else if(grp==='cat') state.cat=val;
    else if(grp==='filter') state.filters[val]=!state.filters[val];
    render(); return; }
  const ts=e.target.closest('[data-toast]'); if(ts){ toast(ts.dataset.toast); return; }
});
document.querySelector('.screen').addEventListener('keydown', e=>{
  const t=e.target.closest('[data-place],[data-nav],[data-navto]');
  if(t && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); t.click(); }
});
document.getElementById('restart').addEventListener('click', ()=>{
  state.screen='welcome'; state.place='osaek'; state.cat='Wellness';
  state.filters={crowd:true, region:true, water:false}; state.saved={}; state.signedUp=false; render(); });

render();
</script>
